version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --frozen --group docs --no-dev
    - uv run --no-sync zensical build --strict
    - mkdir -p "$READTHEDOCS_OUTPUT/html" && cp -r site/. "$READTHEDOCS_OUTPUT/html/"
