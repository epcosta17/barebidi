[project]
name = "barebidi"
version = "0.1.1"
description = "Async Firefox automation for Python, speaking WebDriver BiDi directly, no driver binaries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto" }]
requires-python = ">=3.12"
dependencies = ["websockets>=13"]
keywords = ["firefox", "webdriver-bidi", "bidi", "browser-automation", "web-scraping", "camoufox", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/epcosta17/barebidi"
Documentation = "https://barebidi.readthedocs.io"
Repository = "https://github.com/epcosta17/barebidi"
Issues = "https://github.com/epcosta17/barebidi/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
docs = ["zensical", "mkdocstrings[python]>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barebidi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
