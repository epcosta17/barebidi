[project]
name = "barebidi"
version = "0.1.0"
description = "Browser automation for Python speaking WebDriver BiDi directly, no driver binaries."
requires-python = ">=3.12"
dependencies = ["websockets>=13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barebidi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
