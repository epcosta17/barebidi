<!doctype html>
<html>
<head><meta charset="utf-8"><title>inner</title></head>
<body style="margin:0; background:#eef">
  <div id="widget"></div>
  <input id="name" style="position:absolute; left:150px; top:40px; width:140px">
  <script>
    // Like Cloudflare Turnstile: the checkbox lives in a closed shadow root.
    const root = document.getElementById('widget').attachShadow({mode: 'closed'});
    root.innerHTML = '<input type="checkbox" style="position:absolute; left:20px; top:30px; width:20px; height:20px; margin:0">';
    window.checked = () => root.querySelector('input').checked;
    window.events = [];
    for (const type of ['mousemove', 'mousedown', 'mouseup', 'click', 'keydown'])
      addEventListener(type, event => events.push([type, event.isTrusted]), true);
  </script>
</body>
</html>
